# Сборка и публикация на GitLab Pages.
#
# Node 24, а не что-нибудь постарше, по одной причине: scripts/check-steps.mjs
# импортирует колоды уроков прямо из .ts, без сборки. Это работает только там,
# где включено стирание типов — с Node 22.18 и 23.6 оно уже по умолчанию, но
# на более старых образах проверка просто не запустится.
default:
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

stages:
  - build
  - deploy

# Собирается на любой ветке: npm run build прогоняет check-steps, а он ловит
# расхождение локалей, пометки поверх узлов и утёкшие маркеры подсветки.
# Ломать это лучше в ветке, а не после слияния.
build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

pages:
  stage: deploy
  needs:
    - build
  # Пересобирать нечего: dist приезжает артефактом из предыдущей джобы.
  before_script: []
  script:
    # GitLab Pages публикует каталог public/. В репозитории это исходники
    # статики (шрифты), но к этому моменту astro уже скопировал их внутрь dist,
    # поэтому каталог можно смело заменить целиком.
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
