<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!--
    Обложка «why-ddd-services»: Календарь и ставка сходятся в доменном сервисе.
    Сгенерировано scripts/covers/build.py.
  -->
  <defs>
    <!-- «Мокрый» край, зерно пигмента и тёмная кайма высохшей капли. -->
    <filter id="wash" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="bled" />
      <feGaussianBlur in="bled" stdDeviation="0.8" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain" />
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.6  0 0 0 0 0.57  0 0 0 0 0.55  0 0 0 -0.45 0.5" result="grainTint" />
      <feComposite in="grainTint" in2="soft" operator="in" result="grainIn" />
      <feBlend in="soft" in2="grainIn" mode="multiply" result="granulated" />
      <feMorphology in="bled" operator="erode" radius="2.2" result="inner" />
      <feComposite in="bled" in2="inner" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="0.9" result="rimSoft" />
      <feColorMatrix in="rimSoft" type="matrix"
        values="0.8 0 0 0 0  0 0.8 0 0 0  0 0 0.8 0 0  0 0 0 0.55 0" result="rimDark" />
      <feMerge>
        <feMergeNode in="granulated" />
        <feMergeNode in="rimDark" />
      </feMerge>
    </filter>

    <!-- Линия кистью: неровная, чуть рваная. Область фильтра — весь холст:
         у горизонтальной линии высота рамки нулевая, и фильтр по рамке
         стирал её целиком. -->
    <filter id="brush" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="0.35" />
    </filter>

    <!-- Фоновые размывы: самые мягкие пятна, почти без края. -->
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="w" />
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="6" />
    </filter>
  </defs>
  <g filter="url(#bloom)" opacity="0.5">
    <ellipse cx="130" cy="150" rx="120" ry="110" fill="#f3e8cc" />
    <ellipse cx="360" cy="150" rx="90" ry="90" fill="#d4e6dc" />
    <ellipse cx="540" cy="150" rx="100" ry="100" fill="#e2d8ee" />
  </g>
  <g filter="url(#wash)">
    <rect x="40" y="70" width="130" height="120" rx="8" fill="#f7eacb" opacity="0.95" />
    <rect x="40" y="70" width="130" height="26" rx="8" fill="#e8b7b7" opacity="0.8" />
  </g>
  <g filter="url(#wash)">
    <rect x="54" y="108" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="80" y="108" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="106" y="108" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="132" y="108" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="54" y="132" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="80" y="132" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="106" y="132" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="132" y="132" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="54" y="156" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="80" y="156" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="106" y="156" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
    <rect x="132" y="156" width="16" height="14" rx="3" fill="#b9d3e6" opacity="0.8" />
  </g>
  <g filter="url(#brush)" stroke="#b77f7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <path d="M70 62 v16 M140 62 v16" />
  </g>
  <g filter="url(#wash)">
    <circle cx="120" cy="240" r="26" fill="#f4dca8" opacity="0.9" />
  </g>
  <g filter="url(#brush)" stroke="#9a8b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <path d="M108 252 l24 -24" />
    <path d="M110 232 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" />
    <path d="M130 250 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" />
  </g>
  <g filter="url(#wash)">
    <circle cx="360" cy="150" r="40" fill="#bcd4b4" opacity="0.85" />
    <circle cx="360" cy="150" r="14" fill="#f7eacb" opacity="0.95" />
  </g>
  <g filter="url(#brush)" stroke="#6f8a74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M403.0 150.0 L409.0 150.0" />
    <path d="M390.4 180.4 L394.6 184.6" />
    <path d="M360.0 193.0 L360.0 199.0" />
    <path d="M329.6 180.4 L325.4 184.6" />
    <path d="M317.0 150.0 L311.0 150.0" />
    <path d="M329.6 119.6 L325.4 115.4" />
    <path d="M360.0 107.0 L360.0 101.0" />
    <path d="M390.4 119.6 L394.6 115.4" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <path d="M176 130 Q243.0 136.0 310 142" />
    <path d="M302.5 137.1 L310 142 L301.7 145.5" />
    <path d="M150 232 Q235.6 209.3 314 168" />
    <path d="M305.0 168.0 L314 168 L308.9 175.4" />
  </g>
  <g filter="url(#wash)">
    <rect x="470" y="80" width="130" height="150" rx="8" fill="#cdbfe0" opacity="0.8" />
  </g>
  <g filter="url(#brush)" stroke="#8a7ea3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M490 112 h90" />
    <path d="M490 130 h70" />
    <path d="M490 148 h80" />
  </g>
  <g filter="url(#brush)" stroke="#b77f7f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <path d="M490 196 h56" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <path d="M406 150 Q434.0 150.0 462 150" />
    <path d="M454.1 145.8 L462 150 L454.1 154.2" />
  </g>
  <g filter="url(#wash)" opacity="0.5">
    <circle cx="220" cy="40" r="3" fill="#e8b7b7" opacity="1" />
    <circle cx="620" cy="60" r="3" fill="#cdbfe0" opacity="1" />
    <circle cx="270" cy="260" r="3" fill="#bcd4b4" opacity="1" />
  </g>
</svg>
