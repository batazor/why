<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!--
    Обложка «why-dictionaries»: Строку словаря дописывают в админке, сервис читает свою копию.
    Сгенерировано scripts/covers/build.py.
  -->
  <defs>
    <!-- «Мокрый» край, зерно пигмента и тёмная кайма высохшей капли. -->
    <filter id="wash" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="bled" />
      <feGaussianBlur in="bled" stdDeviation="0.8" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain" />
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.6  0 0 0 0 0.57  0 0 0 0 0.55  0 0 0 -0.45 0.5" result="grainTint" />
      <feComposite in="grainTint" in2="soft" operator="in" result="grainIn" />
      <feBlend in="soft" in2="grainIn" mode="multiply" result="granulated" />
      <feMorphology in="bled" operator="erode" radius="2.2" result="inner" />
      <feComposite in="bled" in2="inner" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="0.9" result="rimSoft" />
      <feColorMatrix in="rimSoft" type="matrix"
        values="0.8 0 0 0 0  0 0.8 0 0 0  0 0 0.8 0 0  0 0 0 0.55 0" result="rimDark" />
      <feMerge>
        <feMergeNode in="granulated" />
        <feMergeNode in="rimDark" />
      </feMerge>
    </filter>

    <!-- Линия кистью: неровная, чуть рваная. Область фильтра — весь холст:
         у горизонтальной линии высота рамки нулевая, и фильтр по рамке
         стирал её целиком. -->
    <filter id="brush" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="0.35" />
    </filter>

    <!-- Фоновые размывы: самые мягкие пятна, почти без края. -->
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="w" />
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="6" />
    </filter>
  </defs>
  <g filter="url(#bloom)" opacity="0.5">
    <ellipse cx="158" cy="150" rx="120" ry="110" fill="#f3e8cc" />
    <ellipse cx="456" cy="150" rx="100" ry="90" fill="#d3e3ee" />
    <ellipse cx="560" cy="250" rx="60" ry="36" fill="#f3d6d6" />
  </g>
  <g filter="url(#wash)">
    <rect x="58" y="64" width="200" height="190" rx="8" fill="#f7eacb" opacity="0.85" />
  </g>
  <g filter="url(#wash)">
    <rect x="76" y="86" width="164" height="20" rx="4" fill="#f4dca8" opacity="0.6" />
    <rect x="76" y="116" width="164" height="20" rx="4" fill="#f4dca8" opacity="0.6" />
    <rect x="76" y="146" width="164" height="20" rx="4" fill="#f4dca8" opacity="0.6" />
    <rect x="76" y="176" width="164" height="20" rx="4" fill="#f4dca8" opacity="0.6" />
    <rect x="76" y="206" width="164" height="20" rx="4" fill="#bcd4b4" opacity="0.95" />
  </g>
  <g filter="url(#brush)" stroke="#9a8b7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5">
    <path d="M90 96 h30 M136 96 h60" />
    <path d="M90 126 h30 M136 126 h72" />
    <path d="M90 156 h30 M136 156 h52" />
    <path d="M90 186 h30 M136 186 h66" />
  </g>
  <g filter="url(#brush)" stroke="#6f8a74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <path d="M90 216 h30 M136 216 h58" />
  </g>
  <g filter="url(#wash)">
    <path d="M226 236 L284 178 L296 190 L238 248 Z" fill="#f2c9a9" opacity="0.9" />
    <path d="M226 236 L238 248 L218 256 Z" fill="#9a8b7a" opacity="0.8" />
  </g>
  <g filter="url(#brush)" stroke="#6f8a74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55" stroke-dasharray="5 8">
    <path d="M270 150 Q321.0 150.0 372 150" />
    <path d="M364.1 145.8 L372 150 L364.1 154.2" />
  </g>
  <g filter="url(#wash)">
    <rect x="384" y="84" width="144" height="132" rx="8" fill="#b9d3e6" opacity="0.8" />
    <rect x="396" y="104" width="120" height="92" rx="8" fill="#f7eacb" opacity="0.9" />
  </g>
  <g filter="url(#wash)">
    <rect x="404" y="112" width="104" height="12" rx="3" fill="#f4dca8" opacity="0.55" />
    <rect x="404" y="132" width="104" height="12" rx="3" fill="#f4dca8" opacity="0.55" />
    <rect x="404" y="152" width="104" height="12" rx="3" fill="#f4dca8" opacity="0.55" />
    <rect x="404" y="172" width="104" height="12" rx="3" fill="#f4dca8" opacity="0.55" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5">
    <path d="M540 150 Q575.0 150.0 610 150" />
    <path d="M602.1 145.8 L610 150 L602.1 154.2" />
  </g>
  <g filter="url(#brush)" stroke="#b77f7f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4">
    <path d="M579.0 250.0 L585.0 250.0" />
    <path d="M573.4 263.4 L577.7 267.7" />
    <path d="M560.0 269.0 L560.0 275.0" />
    <path d="M546.6 263.4 L542.3 267.7" />
    <path d="M541.0 250.0 L535.0 250.0" />
    <path d="M546.6 236.6 L542.3 232.3" />
    <path d="M560.0 231.0 L560.0 225.0" />
    <path d="M573.4 236.6 L577.7 232.3" />
  </g>
  <g filter="url(#wash)">
    <circle cx="560" cy="250" r="14" fill="#e8b7b7" opacity="0.55" />
  </g>
  <g filter="url(#brush)" stroke="#b77f7f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <path d="M588 226 h9 l-9 9 h9" />
  </g>
  <g filter="url(#wash)" opacity="0.5">
    <circle cx="330" cy="250" r="3" fill="#f2c9a9" opacity="1" />
    <circle cx="612" cy="60" r="3" fill="#b9d3e6" opacity="1" />
    <circle cx="40" cy="40" r="3" fill="#bcd4b4" opacity="1" />
  </g>
</svg>
