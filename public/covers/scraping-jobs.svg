<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!--
    Постер разбора «сервис скрейпинг-джоб»: стопка джоб → очередь → пул
    воркеров → чужие сайты, результаты складываются в банку.

    Акварель собрана фильтрами: край пятна «плывёт» (турбулентность +
    смещение), пигмент ложится неровно (зерно, умноженное на заливку), а
    на краю пятна краска темнее — как у высохшей капли. Фон прозрачный:
    бумагу даёт подложка карточки, и в тёмной теме не вспыхивает белый лист.
  -->
  <defs>
    <!-- Размытый, «мокрый» край заливки и зерно пигмента. -->
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="bled" />
      <feGaussianBlur in="bled" stdDeviation="0.8" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain" />
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.6  0 0 0 0 0.57  0 0 0 0 0.55  0 0 0 -0.45 0.5" result="grainTint" />
      <feComposite in="grainTint" in2="soft" operator="in" result="grainIn" />
      <feBlend in="soft" in2="grainIn" mode="multiply" result="granulated" />
      <!-- Тёмная кайма по краю: разница между пятном и его сжатой копией. -->
      <feMorphology in="bled" operator="erode" radius="2.2" result="inner" />
      <feComposite in="bled" in2="inner" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="0.9" result="rimSoft" />
      <feColorMatrix in="rimSoft" type="matrix"
        values="0.8 0 0 0 0  0 0.8 0 0 0  0 0 0.8 0 0  0 0 0 0.55 0" result="rimDark" />
      <feMerge>
        <feMergeNode in="granulated" />
        <feMergeNode in="rimDark" />
      </feMerge>
    </filter>

    <!-- Линия кистью: неровная, чуть рваная. -->
    <filter id="brush" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="0.35" />
    </filter>

    <!-- Капли фона: самые мягкие пятна, почти без края. -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="w" />
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="6" />
    </filter>
  </defs>

  <!-- Фоновые размывы: связывают сюжет в одну картинку. -->
  <g filter="url(#bloom)" opacity="0.5">
    <ellipse cx="120" cy="170" rx="110" ry="80" fill="#f3dcc6" />
    <ellipse cx="330" cy="150" rx="140" ry="60" fill="#d3e3ee" />
    <ellipse cx="540" cy="110" rx="100" ry="80" fill="#e2d8ee" />
    <ellipse cx="520" cy="240" rx="90" ry="50" fill="#d4e6dc" />
  </g>

  <!-- Стопка джоб: три листка с заявками. -->
  <g filter="url(#wash)">
    <rect x="50" y="118" width="96" height="118" rx="7" fill="#f2c9a9" opacity="0.75" transform="rotate(-9 98 177)" />
    <rect x="58" y="110" width="96" height="118" rx="7" fill="#f4dca8" opacity="0.8" transform="rotate(4 106 169)" />
    <rect x="62" y="102" width="96" height="118" rx="7" fill="#f7eacb" opacity="0.9" transform="rotate(-2 110 161)" />
  </g>
  <g filter="url(#brush)" stroke="#9a8b7a" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M78 126 H136" />
    <path d="M78 146 H126" />
    <path d="M78 166 H140" />
    <path d="M78 186 H118" />
    <!-- Галочка ключа идемпотентности в углу листка. -->
    <path d="M128 196 l6 7 l12 -15" stroke="#7fa28a" stroke-width="2.6" />
  </g>

  <!-- Очередь: трубка с джобами-бусинами. -->
  <g filter="url(#wash)">
    <rect x="190" y="146" width="210" height="46" rx="23" fill="#b9d3e6" opacity="0.7" />
    <circle cx="222" cy="169" r="12" fill="#f4dca8" opacity="0.95" />
    <circle cx="258" cy="169" r="12" fill="#f2c9a9" opacity="0.95" />
    <circle cx="294" cy="169" r="12" fill="#f4dca8" opacity="0.95" />
    <circle cx="330" cy="169" r="12" fill="#e8b7b7" opacity="0.9" />
    <circle cx="366" cy="169" r="12" fill="#f4dca8" opacity="0.95" />
  </g>

  <!-- Пул воркеров: четыре круглых работника, один занят. -->
  <g filter="url(#wash)">
    <circle cx="448" cy="150" r="18" fill="#bcd4b4" opacity="0.85" />
    <circle cx="448" cy="196" r="18" fill="#bcd4b4" opacity="0.85" />
    <circle cx="492" cy="150" r="18" fill="#a9c7a1" opacity="0.9" />
    <circle cx="492" cy="196" r="18" fill="#bcd4b4" opacity="0.85" />
  </g>
  <g filter="url(#brush)" stroke="#6f8a74" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M442 150 h12 M448 144 v12" />
    <path d="M486 150 h12 M492 144 v12" />
    <path d="M442 196 h12 M448 190 v12" />
    <path d="M486 196 h12 M492 190 v12" />
  </g>

  <!-- Чужие сайты: окна браузера, одно медленное — розовое. -->
  <g filter="url(#wash)">
    <rect x="532" y="36" width="84" height="56" rx="6" fill="#cdbfe0" opacity="0.8" />
    <rect x="548" y="100" width="76" height="50" rx="6" fill="#d9cde8" opacity="0.8" />
    <rect x="522" y="112" width="30" height="30" rx="5" fill="#e8b7b7" opacity="0.8" />
  </g>
  <g filter="url(#brush)" stroke="#8a7ea3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M540 50 H608" />
    <path d="M556 112 H616" />
    <circle cx="545" cy="44" r="1.6" />
    <circle cx="551" cy="44" r="1.6" />
    <!-- Часики на медленной цели. -->
    <circle cx="537" cy="127" r="8" stroke="#b77f7f" />
    <path d="M537 121 v6 l4 3" stroke="#b77f7f" />
  </g>

  <!-- Банка с результатами. -->
  <g filter="url(#wash)">
    <path d="M520 214 q0 -10 10 -10 h52 q10 0 10 10 v44 q0 12 -12 12 h-48 q-12 0 -12 -12 z" fill="#cfe4de" opacity="0.8" />
    <path d="M524 236 h64 v20 q0 10 -10 10 h-44 q-10 0 -10 -10 z" fill="#9fc9bd" opacity="0.75" />
    <rect x="526" y="196" width="60" height="10" rx="4" fill="#b8d5cd" opacity="0.9" />
  </g>

  <!-- Потоки кистью: джобы в очередь, из очереди к воркерам, к сайтам и в банку. -->
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M160 168 C172 166 178 168 186 169" />
    <path d="M180 162 l8 7 l-8 6" />
    <path d="M404 169 C416 168 422 170 428 172" />
    <path d="M422 165 l8 7 l-8 6" />
    <path d="M510 138 C520 118 526 100 530 88" />
    <path d="M524 94 l7 -8 l3 10" />
    <path d="M508 208 C514 214 516 218 518 224" />
    <path d="M511 222 l8 4 l2 -9" />
  </g>

  <!-- Мелкие брызги: живость без лишних деталей. -->
  <g filter="url(#wash)" opacity="0.5">
    <circle cx="178" cy="92" r="4" fill="#f2c9a9" />
    <circle cx="190" cy="84" r="2.5" fill="#f4dca8" />
    <circle cx="410" cy="236" r="3.5" fill="#b9d3e6" />
    <circle cx="424" cy="246" r="2" fill="#cdbfe0" />
    <circle cx="610" cy="182" r="3" fill="#bcd4b4" />
  </g>
</svg>
