<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!--
    Обложка «why-aggregate-versioning»: Второе сохранение затирает первое; версия ловит это.
    Сгенерировано scripts/covers/build.py.
  -->
  <defs>
    <!-- «Мокрый» край, зерно пигмента и тёмная кайма высохшей капли. -->
    <filter id="wash" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="bled" />
      <feGaussianBlur in="bled" stdDeviation="0.8" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain" />
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.6  0 0 0 0 0.57  0 0 0 0 0.55  0 0 0 -0.45 0.5" result="grainTint" />
      <feComposite in="grainTint" in2="soft" operator="in" result="grainIn" />
      <feBlend in="soft" in2="grainIn" mode="multiply" result="granulated" />
      <feMorphology in="bled" operator="erode" radius="2.2" result="inner" />
      <feComposite in="bled" in2="inner" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="0.9" result="rimSoft" />
      <feColorMatrix in="rimSoft" type="matrix"
        values="0.8 0 0 0 0  0 0.8 0 0 0  0 0 0.8 0 0  0 0 0 0.55 0" result="rimDark" />
      <feMerge>
        <feMergeNode in="granulated" />
        <feMergeNode in="rimDark" />
      </feMerge>
    </filter>

    <!-- Линия кистью: неровная, чуть рваная. Область фильтра — весь холст:
         у горизонтальной линии высота рамки нулевая, и фильтр по рамке
         стирал её целиком. -->
    <filter id="brush" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="0.35" />
    </filter>

    <!-- Фоновые размывы: самые мягкие пятна, почти без края. -->
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="w" />
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="6" />
    </filter>
  </defs>
  <g filter="url(#bloom)" opacity="0.5">
    <ellipse cx="120" cy="150" rx="100" ry="100" fill="#d3e3ee" />
    <ellipse cx="330" cy="150" rx="120" ry="90" fill="#f3e8cc" />
    <ellipse cx="540" cy="150" rx="90" ry="100" fill="#e2d8ee" />
  </g>
  <g filter="url(#wash)">
    <rect x="40" y="60" width="90" height="60" rx="8" fill="#b9d3e6" opacity="0.8" />
    <rect x="40" y="180" width="90" height="60" rx="8" fill="#cdbfe0" opacity="0.8" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M58 84 h50 M58 98 h36" />
  </g>
  <g filter="url(#brush)" stroke="#8a7ea3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M58 204 h50 M58 218 h36" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <path d="M138 90 Q198.0 98.7 250 130" />
    <path d="M245.4 122.3 L250 130 L241.0 129.5" />
  </g>
  <g filter="url(#brush)" stroke="#8a7ea3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <path d="M138 210 Q198.0 201.3 250 170" />
    <path d="M241.0 170.5 L250 170 L245.4 177.7" />
  </g>
  <g filter="url(#wash)">
    <rect x="260" y="70" width="140" height="170" rx="8" fill="#f7eacb" opacity="0.95" />
  </g>
  <g filter="url(#brush)" stroke="#9a8b7a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M282 100 h96" />
    <path d="M282 118 h80" />
    <path d="M282 136 h90" />
  </g>
  <g filter="url(#wash)">
    <rect x="278" y="164" width="104" height="20" rx="8" fill="#b9d3e6" opacity="0.35" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25" stroke-dasharray="4 6">
    <path d="M282 174 h96" />
  </g>
  <g filter="url(#brush)" stroke="#8a7ea3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <path d="M282 210 h80" />
  </g>
  <g filter="url(#wash)">
    <circle cx="520" cy="130" r="44" fill="#bcd4b4" opacity="0.8" />
    <circle cx="520" cy="130" r="30" fill="#a9c7a1" opacity="0.6" />
  </g>
  <g filter="url(#brush)" stroke="#6f8a74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <path d="M506 130 l10 10 l20 -22" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5">
    <path d="M404 150 Q437.0 144.0 470 138" />
    <path d="M461.4 135.3 L470 138 L462.9 143.6" />
  </g>
  <g filter="url(#brush)" stroke="#b77f7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" stroke-dasharray="6 7">
    <path d="M476 170 Q436.7 186.7 420 226" />
    <path d="M427.0 220.3 L420 226 L419.2 217.0" />
  </g>
  <g filter="url(#wash)" opacity="0.5">
    <circle cx="200" cy="40" r="3" fill="#f4dca8" opacity="1" />
    <circle cx="610" cy="230" r="3" fill="#cdbfe0" opacity="1" />
    <circle cx="440" cy="60" r="3" fill="#b9d3e6" opacity="1" />
  </g>
</svg>
