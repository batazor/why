<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!--
    Обложка «panda-clips»: Плёнка с одной пандой: клипы — скобки таймкодов на ней, справа карточки с тегами.
    Сгенерировано scripts/covers/build.py.
  -->
  <defs>
    <!-- «Мокрый» край, зерно пигмента и тёмная кайма высохшей капли. -->
    <filter id="wash" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="bled" />
      <feGaussianBlur in="bled" stdDeviation="0.8" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain" />
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.6  0 0 0 0 0.57  0 0 0 0 0.55  0 0 0 -0.45 0.5" result="grainTint" />
      <feComposite in="grainTint" in2="soft" operator="in" result="grainIn" />
      <feBlend in="soft" in2="grainIn" mode="multiply" result="granulated" />
      <feMorphology in="bled" operator="erode" radius="2.2" result="inner" />
      <feComposite in="bled" in2="inner" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="0.9" result="rimSoft" />
      <feColorMatrix in="rimSoft" type="matrix"
        values="0.8 0 0 0 0  0 0.8 0 0 0  0 0 0.8 0 0  0 0 0 0.55 0" result="rimDark" />
      <feMerge>
        <feMergeNode in="granulated" />
        <feMergeNode in="rimDark" />
      </feMerge>
    </filter>

    <!-- Линия кистью: неровная, чуть рваная. Область фильтра — весь холст:
         у горизонтальной линии высота рамки нулевая, и фильтр по рамке
         стирал её целиком. -->
    <filter id="brush" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="0.35" />
    </filter>

    <!-- Фоновые размывы: самые мягкие пятна, почти без края. -->
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="w" />
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="6" />
    </filter>
  </defs>
  <g filter="url(#bloom)" opacity="0.5">
    <ellipse cx="190" cy="150" rx="170" ry="80" fill="#d3e3ee" />
    <ellipse cx="500" cy="140" rx="110" ry="110" fill="#d4e6dc" />
    <ellipse cx="90" cy="250" rx="70" ry="50" fill="#f3e8cc" />
  </g>
  <g filter="url(#wash)">
    <rect x="40" y="110" width="300" height="80" rx="6" fill="#b9d3e6" opacity="0.85" />
  </g>
  <g filter="url(#wash)">
    <rect x="52" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="88" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="124" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="160" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="196" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="232" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="268" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="304" y="116" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="52" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="88" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="124" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="160" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="196" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="232" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="268" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="304" y="176" width="12" height="8" rx="2" fill="#f7eacb" opacity="0.95" />
    <rect x="50" y="130" width="50" height="40" rx="3" fill="#f7eacb" opacity="0.9" />
    <rect x="108" y="130" width="50" height="40" rx="3" fill="#f7eacb" opacity="0.9" />
    <rect x="166" y="130" width="50" height="40" rx="3" fill="#f4dca8" opacity="0.9" />
    <rect x="224" y="130" width="50" height="40" rx="3" fill="#f7eacb" opacity="0.9" />
    <rect x="282" y="130" width="50" height="40" rx="3" fill="#f7eacb" opacity="0.9" />
  </g>
  <g filter="url(#wash)">
    <circle cx="191" cy="152" r="13" fill="#f7eacb" opacity="1" />
    <circle cx="181" cy="142" r="5" fill="#8792a3" opacity="0.9" />
    <circle cx="201" cy="142" r="5" fill="#8792a3" opacity="0.9" />
    <circle cx="186" cy="152" r="3.5" fill="#8792a3" opacity="0.85" />
