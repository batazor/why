    <path d="M412.2 213.5 L420 218 L411.9 221.9" />
  </g>
  <g filter="url(#wash)">
    <rect x="430" y="58" width="120" height="50" rx="6" fill="#bcd4b4" opacity="0.85" />
    <rect x="430" y="126" width="120" height="50" rx="6" fill="#a9c7a1" opacity="0.85" />
    <rect x="430" y="194" width="120" height="50" rx="6" fill="#bcd4b4" opacity="0.85" />
