    <circle cx="191" cy="158" r="1.8" fill="#8792a3" opacity="0.9" />
  </g>
  <g filter="url(#brush)" stroke="#6f8a74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <path d="M172 98 h-8 v104 h8" />
    <path d="M216 98 h8 v104 h-8" />
  </g>
  <g filter="url(#brush)" stroke="#6f8a74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
