    <path d="M568 92 h28" />
    <path d="M568 160 h28" />
  </g>
  <g filter="url(#brush)" stroke="#9a8b7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5">
    <path d="M60 246 h26 M94 246 h6 M108 246 h26" />
    <path d="M300 246 h26 M334 246 h6 M348 246 h26" />
  </g>
  <g filter="url(#wash)" opacity="0.5">
    <circle cx="360" cy="50" r="3" fill="#bcd4b4" opacity="1" />
