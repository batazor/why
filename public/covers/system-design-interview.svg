<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!--
    Обложка «system-design-interview»: Задание, доска кандидата и рубрика интервьюера.
    Сгенерировано scripts/covers/build.py.
  -->
  <defs>
    <!-- «Мокрый» край, зерно пигмента и тёмная кайма высохшей капли. -->
    <filter id="wash" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="9" xChannelSelector="R" yChannelSelector="G" result="bled" />
      <feGaussianBlur in="bled" stdDeviation="0.8" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain" />
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.6  0 0 0 0 0.57  0 0 0 0 0.55  0 0 0 -0.45 0.5" result="grainTint" />
      <feComposite in="grainTint" in2="soft" operator="in" result="grainIn" />
      <feBlend in="soft" in2="grainIn" mode="multiply" result="granulated" />
      <feMorphology in="bled" operator="erode" radius="2.2" result="inner" />
      <feComposite in="bled" in2="inner" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="0.9" result="rimSoft" />
      <feColorMatrix in="rimSoft" type="matrix"
        values="0.8 0 0 0 0  0 0.8 0 0 0  0 0 0.8 0 0  0 0 0 0.55 0" result="rimDark" />
      <feMerge>
        <feMergeNode in="granulated" />
        <feMergeNode in="rimDark" />
      </feMerge>
    </filter>

    <!-- Линия кистью: неровная, чуть рваная. Область фильтра — весь холст:
         у горизонтальной линии высота рамки нулевая, и фильтр по рамке
         стирал её целиком. -->
    <filter id="brush" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="0.35" />
    </filter>

    <!-- Фоновые размывы: самые мягкие пятна, почти без края. -->
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-20" y="-20" width="680" height="340">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="w" />
      <feDisplacementMap in="SourceGraphic" in2="w" scale="22" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="6" />
    </filter>
  </defs>
  <g filter="url(#bloom)" opacity="0.5">
    <ellipse cx="110" cy="150" rx="90" ry="100" fill="#f3e8cc" />
    <ellipse cx="330" cy="150" rx="150" ry="110" fill="#e8eef3" />
    <ellipse cx="550" cy="150" rx="90" ry="100" fill="#e2d8ee" />
  </g>
  <g filter="url(#wash)">
    <rect x="34" y="70" width="120" height="150" rx="8" fill="#f7eacb" opacity="0.95" />
    <rect x="34" y="70" width="120" height="24" rx="8" fill="#f4dca8" opacity="0.9" />
  </g>
  <g filter="url(#brush)" stroke="#9a8b7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M50 116 h86" />
    <path d="M50 134 h70" />
    <path d="M50 152 h80" />
    <path d="M50 170 h56" />
    <path d="M50 188 h76" />
  </g>
  <g filter="url(#wash)">
    <rect x="196" y="60" width="270" height="190" rx="12" fill="#ffffff" opacity="0.55" />
  </g>
  <g filter="url(#wash)">
    <rect x="214" y="96" width="58" height="38" rx="8" fill="#b9d3e6" opacity="0.85" />
    <rect x="310" y="76" width="64" height="38" rx="8" fill="#bcd4b4" opacity="0.85" />
    <rect x="310" y="150" width="64" height="38" rx="8" fill="#bcd4b4" opacity="0.85" />
    <path d="M404 110 v44 a23.0 7.36 0 0 0 46 0 v-44 z" fill="#9dbfd8" opacity="0.85" />
    <ellipse cx="427.0" cy="110" rx="23.0" ry="7.36" fill="#d3e3ee" opacity="0.95" />
    <rect x="214" y="196" width="58" height="32" rx="8" fill="#f2c9a9" opacity="0.85" />
  </g>
  <g filter="url(#brush)" stroke="#8792a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55">
    <path d="M274 112 Q290.0 104.0 306 96" />
    <path d="M297.0 95.8 L306 96 L300.8 103.3" />
    <path d="M274 118 Q290.0 141.0 306 164" />
    <path d="M304.9 155.1 L306 164 L298.0 159.9" />
    <path d="M378 96 Q390.0 107.0 402 118" />
    <path d="M399.0 109.5 L402 118 L393.3 115.7" />
    <path d="M378 168 Q390.0 155.0 402 142" />
    <path d="M393.5 145.0 L402 142 L399.7 150.7" />
    <path d="M340 190 Q305.0 190.5 276 210" />
    <path d="M285.0 209.1 L276 210 L280.2 202.1" />
  </g>
  <g filter="url(#wash)">
    <circle cx="376" cy="72" r="7" fill="#e8b7b7" opacity="0.95" />
    <circle cx="376" cy="146" r="7" fill="#cdbfe0" opacity="0.95" />
  </g>
  <g filter="url(#wash)">
    <rect x="496" y="70" width="110" height="150" rx="8" fill="#d9cde8" opacity="0.85" />
  </g>
  <g filter="url(#brush)" stroke="#8a7ea3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6">
    <path d="M510 100 h44" />
    <path d="M510 126 h36" />
    <path d="M510 152 h50" />
    <path d="M510 178 h40" />
  </g>
  <g filter="url(#wash)">
    <circle cx="570" cy="100" r="3.4" fill="#a9c7a1" opacity="1" />
    <circle cx="579" cy="100" r="3.4" fill="#e7e1ef" opacity="1" />
    <circle cx="588" cy="100" r="3.4" fill="#e7e1ef" opacity="1" />
    <circle cx="570" cy="126" r="3.4" fill="#a9c7a1" opacity="1" />
    <circle cx="579" cy="126" r="3.4" fill="#a9c7a1" opacity="1" />
    <circle cx="588" cy="126" r="3.4" fill="#e7e1ef" opacity="1" />
    <circle cx="570" cy="152" r="3.4" fill="#a9c7a1" opacity="1" />
    <circle cx="579" cy="152" r="3.4" fill="#a9c7a1" opacity="1" />
    <circle cx="588" cy="152" r="3.4" fill="#a9c7a1" opacity="1" />
    <circle cx="570" cy="178" r="3.4" fill="#a9c7a1" opacity="1" />
    <circle cx="579" cy="178" r="3.4" fill="#e7e1ef" opacity="1" />
    <circle cx="588" cy="178" r="3.4" fill="#e7e1ef" opacity="1" />
  </g>
  <g filter="url(#wash)">
    <circle cx="260" cy="34" r="11" fill="#f4dca8" opacity="0.95" />
    <circle cx="330" cy="30" r="11" fill="#b9d3e6" opacity="0.95" />
    <circle cx="400" cy="34" r="11" fill="#cdbfe0" opacity="0.95" />
  </g>
  <g filter="url(#wash)" opacity="0.5">
    <circle cx="180" cy="260" r="3" fill="#f2c9a9" opacity="1" />
    <circle cx="620" cy="60" r="3" fill="#bcd4b4" opacity="1" />
    <circle cx="470" cy="270" r="3" fill="#b9d3e6" opacity="1" />
  </g>
</svg>
